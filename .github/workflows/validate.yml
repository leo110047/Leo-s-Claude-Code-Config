name: Validate Config

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "=== Validating JSON files ==="
          errors=0

          for f in hooks/hooks.json skills/global/skill-rules.json .claude-plugin/plugin.json; do
            if [ -f "$f" ]; then
              if python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
                echo "  [OK] $f"
              else
                echo "  [ERROR] $f — invalid JSON"
                errors=$((errors + 1))
              fi
            else
              echo "  [SKIP] $f — not found"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "::error::$errors JSON file(s) have syntax errors"
            exit 1
          fi

      - name: Check skills
        run: bash scripts/check-skills.sh

      - name: Check Codex portable baseline
        run: bash scripts/check-codex-portability.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Node dependencies
        run: npm install

      - name: Check coding style gate
        run: node scripts/check-code-style.mjs

      - name: Test coding style gate
        run: npm run test:style-gate

      - name: Replay hook router golden dataset
        run: npm run test:hook-router

      - name: Check hook router coverage matrix
        run: npm run test:hook-router:coverage

      - name: Test eval budget cap checker
        run: npm run test:eval-budget-cap

      - name: Verify hook script references
        run: |
          echo "=== Verifying hook script references ==="
          python3 scripts/verify-hook-script-references.py

      - name: Verify decision guidance parity
        run: |
          echo "=== Verifying decision guidance parity ==="
          bash scripts/verify-decision-guidance.sh

      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile

      - name: Test Goldband Loop Playwright setup behavior
        run: bash scripts/test-goldband-loop-playwright-setup.sh

      - name: Install Goldband Loop Playwright browser
        run: cd goldband-loop && bunx playwright install --with-deps chromium

      - name: Check Goldband Loop inventory
        run: node scripts/check-goldband-loop-inventory.mjs

      - name: Test Goldband Loop free suite
        run: cd goldband-loop && bun run test:free

      - name: Test workflow installer integration
        run: bash scripts/test-workflow-integration.sh

      - name: Summary
        run: |
          echo "=== Validation Summary ==="
          skill_count=$(find skills -name "SKILL.md" | wc -l)
          command_count=$(find commands -name "*.md" 2>/dev/null | wc -l)
          context_count=$(find contexts -name "*.md" 2>/dev/null | wc -l)
          rule_count=$(find rules -name "*.md" 2>/dev/null | wc -l)
          hook_script_count=$(find hooks/scripts/hooks -name "*.js" 2>/dev/null | wc -l)

          echo "  Skills:       $skill_count"
          echo "  Commands:     $command_count"
          echo "  Contexts:     $context_count"
          echo "  Rules:        $rule_count"
          echo "  Hook Scripts: $hook_script_count"

  macos-workflow-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Bash version
        run: bash --version

      - name: Test workflow installer integration on macOS Bash
        run: bash scripts/test-workflow-integration.sh
